[project]
name = "palm-tracer"
version = "1.4.0"
description = "PALM Tracer is an all-in-one software package for the analysis of single molecule localization microscopy (SMLM) data."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
	{ name = "Thibaut Monseigne" },
	{ email = "thibaut.monseigne@u-bordeaux.fr" },
]
classifiers = [
	"Development Status :: 2 - Pre-Alpha",
	"Framework :: napari",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
	"Operating System :: OS Independent",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.12"
dependencies = [
	"colorama",
	"numpy",
	"pandas",
	"magicgui",
	"qtpy",
	"scikit-image",
	"pillow",
	"tifffile",
	"scipy",
	# Dépendances pour les graphiques
	"matplotlib",
	"seaborn",
	"plotly",
	# Dépendances pour l'interface
	"napari",
	# Dépendances pour les infos cross plateforme
	"psutil",
	"py-cpuinfo",
	"nvidia-ml-py"
]

[project.optional-dependencies]
all = [
	"palm-tracer[testing,documentation]",
]

testing = [
	"PySide6",
	"PySide6-Addons",
	"tox",
	"pytest", # https://docs.pytest.org/en/latest/contents.html
	"pytest-cov", # https://pytest-cov.readthedocs.io/en/latest/
	"pytest-qt", # https://pytest-qt.readthedocs.io/en/latest/
	"pytest-json",
	"pytest-json-report",
	"pytest-metadata",
	#"torch" # Installer pytorch à part : pip3 install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
]

documentation = [
	"sphinx",
	"sphinx-autobuild",
	"sphinx-copybutton",
	"sphinx-design",
	"sphinx-rtd-theme",
	"sphinx-qt-documentation",
	"ansi2html", # Utile pour transformer les rapports
	"sphinx-intl"  # Outil de traduction pour Sphinx
]

[project.entry-points."napari.manifest"]
palm-tracer = "palm_tracer:napari.yaml"


[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["palm_tracer"]
exclude = ["docs", "tests"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.ruff]
line-length = 160
target-version = "py312"
fix = true

exclude = [".bzr", ".direnv", ".eggs", ".git", ".mypy_cache", ".pants.d", ".ruff_cache", ".svn", ".tox", ".venv", "__pypackages__",
	"_build", "buck-out", "build", "dist", "node_modules", "venv", "*vendored*", "*_vendor*", ]

[tool.ruff.lint]
select = [
	"E", "F", "W", # .  flake8
	"UP", # .           pyupgrade
	"I", # .            isort
	"BLE", # .          flake8-blind-exception
	"B", # .            flake8-bugbear
	"A", # .            flake8-builtins
	"C4", # .           flake8-comprehensions
	"ISC", # .          flake8-implicit-str-concat
	"G", # .            flake8-logging-format
	"PIE", # .          flake8-pie
	"SIM", # .          flake8-simplify
]

ignore = [
	"E501", # .         Longueur des lignes gérée par le formateur utilisé ponctuellement.
	"UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
	"UP045", # .        Conserve Optional pour les annotations évaluées par les interfaces.
	"E701", "W191", # . Corps courts sur une ligne et indentation par tabulations autorisés.
]

[tool.ruff.lint.isort]
known-first-party = ["palm_tracer", "tests"]
